# Mantiene despierto el backend del plan gratis de Render (se duerme tras 15 minutos sin uso).
# Cada 10 minutos llama a /actuator/health; esa ruta tambien consulta la base de datos,
# asi Supabase no se pausa por inactividad. Horario de uso de Mary: 5:00 a. m. a 10:00 p. m.
# (hora de Colombia = UTC-5), de lunes a sabado; los cron de GitHub van en UTC.
name: Mantener despierto

on:
  schedule:
    - cron: '*/10 10-23 * * 1-6'   # 5:00 a. m. a 6:59 p. m. de Colombia
    - cron: '*/10 0-2 * * 0,2-6'   # 7:00 p. m. a 9:59 p. m. de Colombia (en UTC ya es el dia siguiente; 0 = domingo)
  workflow_dispatch: {}            # tambien se puede lanzar a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al backend
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://marynails-api.onrender.com/actuator/health; then
              echo; echo "Backend despierto"; exit 0
            fi
            echo "Intento $i sin respuesta; espero 20 s"; sleep 20
          done
          echo "El backend no respondio"; exit 1
