spring.application.name=marynails
server.port=${PORT:8080}

# Base de datos (Supabase en produccion; variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marynails}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

# JPA: el esquema lo crea Flyway; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Los mensajes de error (por ejemplo "Elige una clienta") llegan al frontend
spring.web.error.include-message=always
server.error.include-message=always
spring.flyway.enabled=true

# Seguridad
app.jwt.secret=${JWT_SECRET:desarrollo-local-cambia-este-secreto-largo-1234567890}
app.jwt.horas=12
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Usuarios iniciales (solo se crean si la tabla usuario esta vacia)
app.inicial.admin-correo=${ADMIN_CORREO:}
app.inicial.admin-clave=${ADMIN_CLAVE:}
app.inicial.mary-correo=${MARY_CORREO:}
app.inicial.mary-clave=${MARY_CLAVE:}

management.endpoints.web.exposure.include=health
